<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>星空性格 · 星际航行</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="universe"></canvas>
    <div class="ui-container">
        <div id="home" class="panel">
            <h1>🌌 星际航行</h1>
            <p>准备启动曲速引擎。</p>
            <button id="start-btn">启动引擎</button>
        </div>
        <div id="quiz" class="panel" style="display:none;">
            <h2 id="q-text"></h2>
            <div id="options" class="options"></div>
            <button id="next-btn">确认航向</button>
        </div>
        <div id="result" class="panel" style="display:none;">
            <h2>抵达目的地</h2>
            <div id="scene-title"></div>
            <p id="type-desc"></p>
            <div id="traits"></div>
            <p id="scene-desc"></p>
            <button id="restart-btn">重新航行</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
