<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>星空性格 · 星际航行</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; color: white; }
        #universe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .ui-container { position: relative; z-index: 10; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .panel { background: rgba(10, 14, 41, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(100, 100, 255, 0.2); border-radius: 20px; padding: 40px; max-width: 600px; width: 90%; text-align: center; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        h1 { font-size: 2.5rem; background: linear-gradient(90deg, #8a2be2, #4169e1, #00bfff); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 10px; }
        button { background: linear-gradient(135deg, #8a2be2, #4169e1); border: none; padding: 15px 40px; font-size: 1.1rem; color: white; border-radius: 50px; cursor: pointer; margin-top: 20px; }
        button:hover { transform: scale(1.05); }
        .option { background: rgba(255,255,255,0.05); padding: 15px; margin: 10px 0; border-radius: 10px; cursor: pointer; border: 1px solid transparent; transition: all 0.3s ease; text-align: left; }
        .option:hover { background: rgba(65, 105, 225, 0.3); border-color: #4169e1; transform: translateX(10px); }
        .option.selected { background: rgba(138, 43, 226, 0.3); border-color: #8a2be2; }
        #result { display: none; }
        #scene-title { font-size: 2rem; color: #ffd700; margin: 20px 0; }
        #scene-desc { font-style: italic; border-left: 3px solid #4169e1; padding-left: 15px; margin-top: 20px; }
    </style>
</head>
<body>
    <canvas id="universe"></canvas>
    <div class="ui-container">
        <div id="home" class="panel">
            <h1>🌌 星际航行</h1>
            <p>准备启动曲速引擎。</p>
            <button onclick="startTest()">启动引擎</button>
        </div>
        <div id="quiz" class="panel" style="display:none;">
            <h2 id="q-text"></h2>
            <div id="options"></div>
            <button onclick="next()">确认航向</button>
        </div>
        <div id="result" class="panel" style="display:none;">
            <h2>抵达目的地</h2>
            <div id="scene-title"></div>
            <p id="type-desc"></p>
            <div id="traits"></div>
            <p id="scene-desc"></p>
            <button onclick="location.reload()">重新航行</button>
        </div>
    </div>

    <script>
        const questions = [
            { q: "航行模式？", o: ["舰队指挥", "单人漂泊", "护航任务", "外交访问", "深空侦察"], d: "E" },
            { q: "遭遇陨石带？", o: ["强行突破", "绕道而行", "建立屏障", "呼叫支援", "分析弱点"], d: "N" },
            { q: "能源管理？", o: ["严格配额", "按需分配", "节省为主", "尽情挥霍", "寻找新能源"], d: "C" },
            { q: "发现未知生命？", o: ["接触交流", "观察记录", "保护距离", "捕获研究", "分享情报"], d: "A" },
            { q: "飞船装饰风格？", o: ["实用金属", "艺术涂鸦", "古典庄严", "温馨舒适", "极简虚空"], d: "O" }
        ];

        const personalities = [
            { type: "🚀 脉冲星指挥官", desc: "你习惯于掌控全局。", traits: ["决断", "战略"], scene: "pulsar", comment: "前方出现规律闪烁的脉冲星。" },
            { type: "🎨 星云流浪者", desc: "你享受自由的漂泊。", traits: ["浪漫", "自由"], scene: "nebula", comment: "你正漂流在一片粉紫色的星云中。" },
            { type: "🛡️ 双星守护者", desc: "你是稳定的基石。", traits: ["忠诚", "稳定"], scene: "binary", comment: "两颗巨大的行星在你周围互旋。" },
            { type: "☄️ 虫洞穿梭客", desc: "你是能量的传递者。", traits: ["活力", "连接"], scene: "wormhole", comment: "前方出现扭曲的虫洞！" },
            { type: "🔭 虚空观测者", desc: "你站在寂静的彼岸。", traits: ["理性", "深邃"], scene: "blackhole", comment: "警告：前方引力异常！" }
        ];

        let current = 0, answers = [], scores = {O:0,C:0,E:0,A:0,N:0};
        let canvas, ctx, particles = [];
        let mouse = { x: innerWidth/2, y: innerHeight/2 };
        let currentScene = 'stars';

        class Particle {
            constructor() {
                this.x = Math.random() * innerWidth;
                this.y = Math.random() * innerHeight;
                this.z = Math.random() * innerWidth;
                this.size = Math.random() * 2 + 0.5;
                this.speed = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.z -= this.speed;
                if (this.z < 1) {
                    this.z = innerWidth;
                    this.x = Math.random() * innerWidth;
                    this.y = Math.random() * innerHeight;
                }
            }
            draw() {
                let perspective = innerWidth / (this.z + innerWidth);
                let x2d = (this.x - innerWidth/2) * perspective + innerWidth/2;
                let y2d = (this.y - innerHeight/2) * perspective + innerHeight/2;
                ctx.beginPath();
                ctx.fillStyle = `rgba(255, 255, 255, ${1 - this.z/innerWidth})`;
                ctx.arc(x2d, y2d, this.size * (1 - this.z/innerWidth), 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 200; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        function startTest() {
            home.style.display = 'none';
            quiz.style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[current];
            qText.innerText = `星域 ${current+1}/${questions.length}: ${q.q}`;
            options.innerHTML = '';
            q.o.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerText = opt;
                div.onclick = () => select(i, div);
                options.appendChild(div);
            });
        }

        function select(i, el) {
            document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            answers[current] = i;
        }

        function next() {
            if (answers[current] === undefined) { alert("请选择探测方向！"); return; }
            const dim = questions[current].d;
            scores[dim] += (5 - answers[current]); 
            current++;
            if (current < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quiz.style.display = 'none';
            result.style.display = 'block';

            // 简单粗暴的匹配：谁分高选谁
            let maxScore = -1;
            let dominantTrait = 'E';
            for (const key in scores) {
                if (scores[key] > maxScore) {
                    maxScore = scores[key];
                    dominantTrait = key;
                }
            }

            let matchedPersonality = personalities[0];
            if (dominantTrait === 'O') matchedPersonality = personalities[1];
            if (dominantTrait === 'C') matchedPersonality = personalities[2];
            if (dominantTrait === 'E') matchedPersonality = personalities[3];
            if (dominantTrait === 'N') matchedPersonality = personalities[4];

            document.getElementById('scene-title').innerText = matchedPersonality.type;
            document.getElementById('type-desc').innerText = matchedPersonality.desc;
            document.getElementById('scene-desc').innerText = matchedPersonality.comment;
            document.getElementById('traits').innerHTML = matchedPersonality.traits.map(t => `<span style="display:inline-block;background:rgba(138,43,226,0.2);padding:5px 10px;border-radius:15px;margin:5px;">${t}</span>`).join('');
        }

        window.onload = () => {
            canvas = document.getElementById('universe');
            ctx = canvas.getContext('2d');
            canvas.width = innerWidth;
            canvas.height = innerHeight;
            initParticles();
            animate();
            window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
            window.addEventListener('resize', () => { canvas.width = innerWidth; canvas.height = innerHeight; });
        };
    </script>
</body>
</html>
