<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>星空性格宇宙 · 深度版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap');
        
        :root { --bg: #0a0e29; --purple: #8a2be2; --blue: #4169e1; --gold: #ffd700; }
        body { margin: 0; font-family: 'Noto Sans SC', sans-serif; background: var(--bg); color: #e0e0ff; min-height: 100vh; overflow-x: hidden; }
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%); }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 2s infinite alternate; }
        @keyframes twinkle { from { opacity: 0.3; } to { opacity: 1; } }
        
        .container { max-width: 800px; margin: auto; padding: 20px; }
        header { text-align: center; padding: 40px 0; }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 2.8rem; background: linear-gradient(90deg, var(--purple), var(--blue), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 20px rgba(138, 43, 226, 0.5); }
        
        .panel { display: none; background: rgba(16, 20, 48, 0.9); border-radius: 20px; padding: 40px; margin-top: 20px; border: 1px solid rgba(100, 100, 255, 0.2); backdrop-filter: blur(10px); animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .btn { display: inline-block; padding: 15px 50px; font-size: 1.2rem; background: linear-gradient(135deg, var(--purple), var(--blue)); color: white; border: none; border-radius: 50px; cursor: pointer; margin-top: 20px; transition: all 0.3s ease; }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(138, 43, 226, 0.7); }
        
        .question-text { font-size: 1.5rem; margin-bottom: 30px; color: white; }
        .option { background: rgba(30, 35, 70, 0.7); padding: 15px 20px; margin: 10px 0; border-radius: 10px; cursor: pointer; border: 1px solid transparent; transition: all 0.3s ease; }
        .option:hover { background: rgba(65, 105, 225, 0.3); border-color: var(--blue); transform: translateX(10px); }
        .option.selected { background: rgba(138, 43, 226, 0.3); border-color: var(--purple); }
        
        .loader { display: none; text-align: center; padding: 50px; }
        .spinner { width: 80px; height: 80px; border: 8px solid rgba(255,255,255,0.1); border-top: 8px solid var(--purple); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .result-title { font-size: 2.5rem; color: var(--gold); margin: 20px 0; }
        .radar-container { max-width: 400px; margin: 30px auto; }
        .trait-tag { display: inline-block; background: rgba(138, 43, 226, 0.2); border: 1px solid var(--purple); padding: 8px 15px; border-radius: 20px; margin: 5px; }
        .comment { font-style: italic; color: #aaa; margin-top: 20px; border-left: 3px solid var(--blue); padding-left: 15px; }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="container">
        <header><h1>🌌 星空性格宇宙</h1><p>深度解析你的内在星系</p></header>
        
        <div id="home" class="panel" style="display:block;">
            <h2>准备发射</h2>
            <p>本次航行包含 12 道星域探测题，系统将根据你的选择生成专属星图。</p>
            <button class="btn" onclick="startTest()">启动引擎</button>
        </div>
        
        <div id="quiz" class="panel">
            <div id="question" class="question-text"></div>
            <div id="options"></div>
            <button class="btn" onclick="nextQuestion()">下一站</button>
        </div>
        
        <div id="loading" class="loader">
            <div class="spinner"></div>
            <h2>正在校准星轨...</h2>
            <p>分析你的性格引力波</p>
        </div>
        
        <div id="result" class="panel">
            <h2>探测完毕</h2>
            <div class="result-title" id="typeName"></div>
            <div class="radar-container"><canvas id="radarChart"></canvas></div>
            <p id="typeDesc"></p>
            <div id="traits"></div>
            <p class="comment" id="comment"></p>
            <button class="btn" onclick="location.reload()">重新探测</button>
        </div>
    </div>

    <script>
        const questions = [
            { q: "周末你倾向于？", o: ["策划聚会", "独自充电", "户外探险", "整理家务"], d: "E" },
            { q: "面对突发状况？", o: ["兴奋挑战", "冷静分析", "焦虑不安", "随遇而安"], d: "N" },
            { q: "做事风格？", o: ["严格计划", "大概方向", "随心所欲", "参考经验"], d: "C" },
            { q: "朋友倾诉时？", o: ["给方案", "陪吐槽", "安慰", "讲道理"], d: "A" },
            { q: "对新事物的态度？", o: ["首批尝鲜", "观望", "谨慎", "无感"], d: "O" },
            { q: "工作中最看重？", o: ["成就感", "稳定性", "人际关系", "能力提升"], d: "C" },
            { q: "犯错时反应？", o: ["立刻修正", "反思自责", "找借口", "无所谓"], d: "N" },
            { q: "社交能量来源？", o: ["人群", "独处", "小圈子", "线上"], d: "E" },
            { q: "如何看待规则？", o: ["遵守", "灵活运用", "打破", "无视"], d: "C" },
            { q: "看到不公之事？", o: ["挺身而出", "默默忍受", "理性分析", "转移话题"], d: "A" },
            { q: "想象力水平？", o: ["天马行空", "基于现实", "偶尔闪现", "几乎为零"], d: "O" },
            { q: "做决定依据？", o: ["直觉", "逻辑", "他人意见", "过往经验"], d: "A" }
        ];
        
        const personalities = [
            { type: "🚀 宇宙指挥官", desc: "你拥有极强的掌控欲和领导力，像一颗恒星般耀眼。你擅长统筹全局，执行力满分，但偶尔也要听听船员的心声。", traits: ["果断","战略","自信","目标导向"], scores: {O:3,C:5,E:4,A:2,N:2}, comment: "你的气场就是引力，所有人都会不由自主地被你吸引。" },
            { type: "🎨 流浪诗人", desc: "你的内心是一座流动的美术馆。你追求自由与美感，讨厌束缚，总能发现被忽略的细节。", traits: ["创意","感性","自由","理想主义"], scores: {O:5,C:2,E:3,A:4,N:3}, comment: "生活不止眼前的苟且，还有诗和远方的田野。" },
            { type: "🛡️ 守护卫士", desc: "你是团队的基石，稳重可靠。你重视承诺和传统，虽然不善言辞，但行动力惊人。", traits: ["忠诚","务实","负责","条理"], scores: {O:2,C:5,E:2,A:4,N:2}, comment: "有你在，大家就觉得安心，你是所有人的避风港。" },
            { type: "☄️ 社交彗星", desc: "你充满活力，走到哪里就把快乐带到哪里。你的社交网络遍布星系，但也要记得给自己留点独处时间。", traits: ["热情","沟通","乐观","人脉"], scores: {O:3,C:3,E:5,A:4,N:2}, comment: "你的笑容具有感染力，是团队里的气氛调节剂。" },
            { type: "🔬 虚空观察者", desc: "你习惯抽离视角看待世界，理性而冷静。你不喜欢过于热闹的环境，更喜欢在安静中思考宇宙的真理。", traits: ["理性","独立","深刻","低调"], scores: {O:4,C:4,E:1,A:3,N:4}, comment: "沉默是你的保护色，思考是你的超能力。" }
        ];

        let current = 0, answers = [], scores = {O:0,C:0,E:0,A:0,N:0};

        function createStars() {
            const c = document.getElementById('stars');
            for(let i=0;i<150;i++) {
                const s = document.createElement('div');
                s.className = 'star';
                s.style.width = s.style.height = Math.random()*3+1+'px';
                s.style.left = Math.random()*100+'%';
                s.style.top = Math.random()*100+'%';
                s.style.animationDelay = Math.random()*2+'s';
                c.appendChild(s);
            }
        }

        function startTest() {
            home.style.display = 'none';
            quiz.style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[current];
            question.innerText = `星域 ${current+1}/${questions.length}: ${q.q}`;
            options.innerHTML = '';
            q.o.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerText = opt;
                div.onclick = () => selectOption(i, div);
                options.appendChild(div);
            });
        }

        function selectOption(i, el) {
            document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            answers[current] = i;
        }

        function nextQuestion() {
            if(answers[current] === undefined) return alert('请选择探测方向！');
            const map = {O:0, C:0, E:0, A:0, N:0};
            const dim = questions[current].d;
            map[dim] = 4 - answers[current]; 
            scores.O += map.O; scores.C += map.C; scores.E += map.E; scores.A += map.A; scores.N += map.N;
            
            current++;
            if(current < questions.length) loadQuestion();
            else showResult();
        }

        function showResult() {
            quiz.style.display = 'none';
            loading.style.display = 'block';
            
            setTimeout(() => {
                loading.style.display = 'none';
                result.style.display = 'block';
                
                let bestMatch = personalities[0];
                let minDiff = Infinity;
                personalities.forEach(p => {
                    const diff = Math.abs(scores.O - p.scores.O) + Math.abs(scores.C - p.scores.C) + Math.abs(scores.E - p.scores.E) + Math.abs(scores.A - p.scores.A) + Math.abs(scores.N - p.scores.N);
                    if(diff < minDiff) { minDiff = diff; bestMatch = p; }
                });

                document.getElementById('typeName').innerText = bestMatch.type;
                document.getElementById('typeDesc').innerText = bestMatch.desc;
                document.getElementById('comment').innerText = bestMatch.comment;
                
                const traitsHtml = bestMatch.traits.map(t => `<span class="trait-tag">${t}</span>`).join('');
                document.getElementById('traits').innerHTML = traitsHtml;
                
                renderChart(bestMatch.scores);
            }, 2000);
        }

        function renderChart(data) {
            new Chart(document.getElementById('radarChart'), {
                type: 'radar',
                data: {
                    labels: ['开放性', '尽责性', '外向性', '宜人性', '情绪稳定'],
                    datasets: [{ label: '你的星图', data: [data.O*2, data.C*2, data.E*2, data.A*2, (6-data.N)*2], backgroundColor: 'rgba(138,43,226,0.3)', borderColor: '#8a2be2', pointBackgroundColor: '#4169e1' }]
                },
                options: { scales: { r: { angleLines: { color: 'rgba(255,255,255,0.1)' }, grid: { color: 'rgba(255,255,255,0.1)' }, pointLabels: { color: '#e0e0ff' }, ticks: { display: false } } }, plugins: { legend: { labels: { color: '#e0e0ff' } } } }
            });
        }

        createStars();
    </script>
</body>
</html>
